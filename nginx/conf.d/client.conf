# =============================================================================
# client.conf — 預設路由：掛載 Unity WebGL 靜態版目錄
# 說明：
#   - Unity WebGL 以 decompressionFallback=true 編譯，無需 nginx 主動解壓縮
#   - 所有 .br / .gz 檔案由 Unity 的 Build/WebGL loader 在瀏覽器端自行解壓
#   - 此設定直接靜態服務 /webgl 目錄，不修改任何 Content-Encoding
#   - api.conf / dev.conf 的 location 區塊透過 include 引入同一 server {} 內
# =============================================================================

upstream web_api_upstream {
    server web-api:5000;
}

server {
    listen 80;
    server_name localhost;

    # Docker 內部 DNS resolver (允許 upstream 動態解析, nginx -t 孤立測試時可能警告)
    resolver 127.0.0.11 valid=10s;

    # ── WebGL 靜態檔案根目錄 ─────────────────────────────────────────────────
    # 對應 docker-compose volumes 中 ../uvc-client/Builds/WebGL:/var/www/webgl:ro
    location /webgl/ {
        alias /var/www/webgl/;
        index index.html;

        # Unity WebGL (decompressionFallback 模式) — 由 UnityLoader.js 在瀏覽器端解壓
        # nginx 只負責原始位元組傳輸，不設 Content-Encoding
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;

        # CORS — 相容本地 file:// 與跨域預覽
        add_header 'Access-Control-Allow-Origin' '*' always;

        # SharedArrayBuffer (Unity WebGL 多執行緒支援需要)
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        try_files $uri $uri/ /webgl/index.html;
    }

    # 根路由：轉向 WebGL 入口 (Phase 1 PoC 預設頁面)
    location = / {
        return 302 /webgl/;
    }

    # ── 引入 API / Dev 功能 location 區塊 ────────────────────────────────────
    include /etc/nginx/conf.d/api.conf;
    include /etc/nginx/conf.d/dev.conf;
}
