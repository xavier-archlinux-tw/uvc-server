# =============================================================================
# api.conf — 反向代理：API / WebSocket / SSE 路由 location 區塊
#
# 注意：此檔案不含 server {} 外殼，直接由 client.conf server {} 的 include 引入
# 對應 upstream: web_api_upstream (定義於 client.conf)
# =============================================================================

    # ── WebSocket 升級轉發端點 ────────────────────────────────────────────────
    location /ws {
        proxy_pass http://web_api_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SSE 即時日誌串流 ──────────────────────────────────────────────────────
    # 關閉緩衝以達成零延遲直通，相容 Cloudflare Quick Tunnel
    location /api/logs/stream {
        proxy_pass http://web_api_upstream/api/logs/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Accel-Buffering "no";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering "no" always;
        proxy_read_timeout 3600s;
    }

    # ── HTTP REST API ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://web_api_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS (相容 WebGL 與跨域測試)
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
