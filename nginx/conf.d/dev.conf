# =============================================================================
# dev.conf — 測試主控台、OpenAPI Swagger 與一般 HTTP 路由 location 區塊
#
# 注意：此檔案不含 server {} 外殼，直接由 client.conf server {} 的 include 引入
# 對應 upstream: web_api_upstream (定義於 client.conf)
# =============================================================================

    # ── Web 測試主控台、OpenAPI Swagger 與通用 HTTP ───────────────────────────
    # 匹配所有未被 /webgl/ /ws /api/ 明確攔截的請求，轉發至後端
    location / {
        proxy_pass http://web_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS (相容 WebGL 與跨域測試)
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
