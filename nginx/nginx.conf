# =============================================================================
# nginx.conf — 主入口框架 (Global / Events / HTTP 框架層)
#
# 架構說明：
#   nginx.conf     → 全域設定 + http {} 框架
#   conf.d/
#     client.conf  → server {} 主體 (WebGL 靜態, upstream 宣告)
#       ↳ include api.conf   (location 片段：API / WS / SSE 反向代理)
#       ↳ include dev.conf   (location 片段：測試主控台 / Swagger 通用路由)
#
# 注意：http {} 內只 include client.conf，api.conf / dev.conf 不帶 server {}
#       外殼，由 client.conf 在 server {} 內以 include 方式引入
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 主功能設定：client (WebGL + API + Dev) 三合一 server 區塊
    include /etc/nginx/conf.d/client.conf;
}
