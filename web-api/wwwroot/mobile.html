<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UVC 現場互動 - 行動端</title>
    <style>
        :root {
            --bg-base: #0f1017;
            --bg-card: #181a24;
            --primary-fan: #00e5ff;
            --host-gold: #ffb74d;
            --text-main: #f0f2ff;
            --text-muted: #8e92a8;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --border: #2a2d3e;
            --theme-color: #00e5ff;
            --theme-glow: rgba(0, 229, 255, 0.4);
            --theme-bubble: #142834;
        }

        body.role-host {
            --theme-color: var(--host-gold);
            --theme-glow: rgba(255, 183, 77, 0.4);
            --theme-bubble: #2b1f14;
        }
        body.role-audience {
            --theme-color: var(--primary-fan);
            --theme-glow: rgba(0, 229, 255, 0.4);
            --theme-bubble: #142834;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s;
        }

        /* 手機頂部 Header */
        header {
            background: var(--bg-card);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .header-title {
            font-size: 0.95rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--theme-color);
            transition: color 0.2s;
        }
        .status-badge {
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #202330;
            padding: 3px 8px;
            border-radius: 12px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-red); }
        .dot.connected { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }

        /* 頂部身分設定列 (Role & Name Setup) */
        .setup-strip {
            background: #141520;
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .setup-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .role-selector {
            display: flex;
            flex: 1;
            background: #090a10;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2px;
            gap: 2px;
        }
        .role-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 4px;
            border-radius: 4px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .role-btn.active.host-active {
            background: var(--host-gold);
            color: #000;
            box-shadow: 0 0 8px rgba(255, 183, 77, 0.4);
        }
        .role-btn.active.fan-active {
            background: var(--primary-fan);
            color: #000;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        .name-box {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .mobile-name-input {
            flex: 1;
            background: #090a10;
            border: 1px solid var(--border);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .mobile-name-input:focus { border-color: var(--theme-color); }
        .btn-join {
            background: #25283b;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-join:hover { background: var(--theme-color); color: #000; }

        /* 房間與角色資訊條 */
        .info-strip {
            background: #10111a;
            padding: 6px 14px;
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1a1c29;
        }
        .info-strip strong { color: var(--theme-color); }

        /* 聊天氣泡滾動區 */
        .chat-box {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }
        .bubble-self {
            align-self: flex-end;
            background: var(--theme-bubble);
            border: 1px solid var(--theme-glow);
            border-bottom-right-radius: 2px;
        }
        .bubble-other-host {
            align-self: flex-start;
            background: #2c2014;
            border: 1px solid rgba(255, 183, 77, 0.4);
            border-bottom-left-radius: 2px;
        }
        .bubble-other-fan {
            align-self: flex-start;
            background: #142834;
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-bottom-left-radius: 2px;
        }
        .bubble-system {
            align-self: center;
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
        }
        .bubble-alert {
            align-self: center;
            background: rgba(255, 82, 82, 0.15);
            color: var(--accent-red);
            font-size: 0.78rem;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
        }
        .sender-name {
            font-size: 0.72rem;
            font-weight: 800;
            margin-bottom: 3px;
        }
        .sender-host { color: var(--host-gold); }
        .sender-fan { color: var(--primary-fan); }

        /* 底部操作列 */
        .footer-bar {
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .input-text {
            flex: 1;
            background: #0f1017;
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-text:focus { border-color: var(--theme-color); }
        .btn-send {
            background: var(--theme-color);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 0.92rem;
            font-weight: 800;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-send:active { opacity: 0.8; }
        .btn-spam {
            background: #2e1d20;
            color: #ff8a80;
            border: 1px solid rgba(255, 82, 82, 0.3);
            border-radius: 8px;
            padding: 12px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body class="role-audience">

    <!-- 頂部狀態列 -->
    <header>
        <div class="header-title" id="header-title">
            <span>💬 現場觀眾端 (Mobile)</span>
        </div>
        <div class="status-badge">
            <div class="dot" id="status-dot"></div>
            <span id="status-text">連線中...</span>
        </div>
    </header>

    <!-- 頂部身分自選與名稱設定列 -->
    <div class="setup-strip">
        <div class="setup-row">
            <div class="role-selector">
                <button class="role-btn" id="btn-role-host">👑 主播 (Host)</button>
                <button class="role-btn active fan-active" id="btn-role-fan">💬 觀眾 (Fan)</button>
            </div>
        </div>
        <div class="setup-row name-box">
            <input type="text" id="mobile-name-input" class="mobile-name-input" placeholder="自訂顯示名稱" value="現場合夥人(手機)">
            <button id="btn-reconnect" class="btn-join">重新配對</button>
        </div>
    </div>

    <div class="info-strip">
        <span id="role-tag">當前角色: <strong>Audience (觀眾)</strong></span>
        <span id="room-tag">房間: 撮合中...</span>
    </div>

    <div class="chat-box" id="chat-box">
        <div class="bubble bubble-system">[系統] 正在連接直播間 WebSocket 伺服器...</div>
    </div>

    <div class="footer-bar">
        <input type="text" class="input-text" id="msg-input" placeholder="輸入訊息..." value="合夥人手機現場實測！太酷了！">
        <button class="btn-send" id="btn-send">發送</button>
        <button class="btn-spam" id="btn-spam" title="測試 700ms 頻率限制">防刷</button>
    </div>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws`;

        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const headerTitle = document.getElementById('header-title');
        const roleTag = document.getElementById('role-tag');
        const roomTag = document.getElementById('room-tag');
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const btnSend = document.getElementById('btn-send');
        const btnSpam = document.getElementById('btn-spam');
        const nameInput = document.getElementById('mobile-name-input');
        const btnRoleHost = document.getElementById('btn-role-host');
        const btnRoleFan = document.getElementById('btn-role-fan');
        const btnReconnect = document.getElementById('btn-reconnect');

        // 解析 URL 參數
        const urlParams = new URLSearchParams(window.location.search);
        let currentRole = urlParams.get('role') === 'host' ? 'host' : 'audience';
        let currentNickname = urlParams.get('name') || (currentRole === 'host' ? '星光主播·晨星' : '現場合夥人(手機)');

        nameInput.value = currentNickname;
        let ws = null;

        // 應用角色樣式
        function applyRoleTheme(role) {
            currentRole = role;
            document.body.className = role === 'host' ? 'role-host' : 'role-audience';
            
            if (role === 'host') {
                btnRoleHost.className = 'role-btn active host-active';
                btnRoleFan.className = 'role-btn';
                headerTitle.innerHTML = '<span>👑 現場主播端 (Mobile)</span>';
                roleTag.innerHTML = '當前角色: <strong>Host (主播 / VIP)</strong>';
                if (!urlParams.get('name') && nameInput.value === '現場合夥人(手機)') {
                    nameInput.value = '星光主播·晨星';
                }
            } else {
                btnRoleHost.className = 'role-btn';
                btnRoleFan.className = 'role-btn active fan-active';
                headerTitle.innerHTML = '<span>💬 現場觀眾端 (Mobile)</span>';
                roleTag.innerHTML = '當前角色: <strong>Audience (觀眾)</strong>';
                if (!urlParams.get('name') && nameInput.value === '星光主播·晨星') {
                    nameInput.value = '現場合夥人(手機)';
                }
            }
        }

        applyRoleTheme(currentRole);

        // 角色按鈕監聽
        btnRoleHost.addEventListener('click', () => {
            if (currentRole !== 'host') {
                applyRoleTheme('host');
                reconnect();
            }
        });

        btnRoleFan.addEventListener('click', () => {
            if (currentRole !== 'audience') {
                applyRoleTheme('audience');
                reconnect();
            }
        });

        btnReconnect.addEventListener('click', reconnect);

        function reconnect() {
            if (ws) {
                ws.close();
            }
            chatBox.innerHTML = '<div class="bubble bubble-system">[系統] 重新初始化連線與撮合...</div>';
            roomTag.innerText = '房間: 撮合中...';
            connect();
        }

        function getNickname() {
            return nameInput.value.trim() || (currentRole === 'host' ? '一瞬晨星' : '熱情觀眾');
        }

        function connect() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusDot.classList.add('connected');
                statusText.innerText = '已連線';
                
                // 發送撮合請求
                const pkt = {
                    action: 'join_match',
                    sender: getNickname(),
                    role: currentRole,
                    data: 'Host_Fan'
                };
                ws.send(JSON.stringify(pkt));
            };

            ws.onmessage = (e) => {
                const pkt = JSON.parse(e.data);

                if (pkt.action === 'match_found') {
                    const data = JSON.parse(pkt.data);
                    roomTag.innerText = `房間: ${data.roomId}`;
                    appendBubble('bubble-system', `[系統] 撮合成功！已進入房間 ${data.roomId}，配對對象為「${data.opponent}」`);
                }
                else if (pkt.action === 'broadcast_msg') {
                    const isHost = pkt.role === 'host';
                    const isSelf = pkt.sender === getNickname();
                    
                    let bubbleClass = 'bubble-self';
                    if (!isSelf) {
                        bubbleClass = isHost ? 'bubble-other-host' : 'bubble-other-fan';
                    }
                    
                    const senderColor = isHost ? 'sender-host' : 'sender-fan';
                    const senderTitle = isHost ? `👑 ${pkt.sender} (VIP)` : `💬 ${pkt.sender}`;

                    appendBubble(bubbleClass, `
                        <div class="sender-name ${senderColor}">${senderTitle}</div>
                        <div>${pkt.data}</div>
                    `);
                }
                else if (pkt.action === 'rate_limited') {
                    appendBubble('bubble-alert', `⚠️ [頻率限制] ${pkt.data}`);
                }
            };

            ws.onclose = () => {
                statusDot.classList.remove('connected');
                statusText.innerText = '已斷線';
            };
        }

        function appendBubble(className, innerHtml) {
            const div = document.createElement('div');
            div.className = `bubble ${className}`;
            div.innerHTML = innerHtml;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        btnSend.addEventListener('click', () => {
            const text = msgInput.value.trim();
            if (text && ws && ws.readyState === WebSocket.OPEN) {
                const pkt = {
                    action: 'send_msg',
                    sender: getNickname(),
                    role: currentRole,
                    data: text
                };
                ws.send(JSON.stringify(pkt));
                msgInput.value = '';
            }
        });

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') btnSend.click();
        });

        btnSpam.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const pkt1 = { action: 'send_msg', sender: getNickname(), role: currentRole, data: '手機連續發言 (1)' };
                ws.send(JSON.stringify(pkt1));
                setTimeout(() => {
                    const pkt2 = { action: 'send_msg', sender: getNickname(), role: currentRole, data: '手機連續發言 (2 - 觸發冷卻)' };
                    ws.send(JSON.stringify(pkt2));
                }, 80);
            }
        });

        window.addEventListener('load', connect);
    </script>
</body>
</html>
